name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Триггер запуска при пуше в ветку main
  workflow_dispatch: # Позволяет запускать деплой вручную из вкладки Actions

# Разрешения, необходимые для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3 # Официальный экшен от команды Astro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
